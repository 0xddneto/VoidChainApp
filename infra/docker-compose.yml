# Persistent local infrastructure for VoidScan.
#
# The indexer is kept as an ordinary Node process during development, while
# Postgres lives here so its state and initialization are reproducible. Run it
# from the repository root with `docker compose -f infra/docker-compose.yml up -d`.

name: voidscan

services:
  postgres:
    image: postgres:17-alpine
    container_name: voidscan-db
    environment:
      POSTGRES_USER: voidscan
      POSTGRES_PASSWORD: voidscan
      POSTGRES_DB: voidscan
    ports:
      # 5433 on the host avoids colliding with an existing local Postgres.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Init scripts run only the first time this named volume is created.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidscan -d voidscan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
