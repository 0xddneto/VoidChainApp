# Runs on every push, because a test suite nobody runs is documentation.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  voiddex:
    name: voiddex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voiddex/package-lock.json
      - run: npm ci
        working-directory: voiddex
      # Intentionally do not install web: this must be an independent build.
      - run: npm run build
        working-directory: voiddex

  sponsored-receipts:
    name: sponsored-receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: script/package-lock.json
      - run: npm ci
        working-directory: script
      - run: node --import tsx test-sponsored-receipt.ts
        working-directory: script

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - run: npm run typecheck
        working-directory: indexer

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            script/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: script
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: script
      - run: npm run build:contracts
        working-directory: script
