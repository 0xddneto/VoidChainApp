# Runs on every push, because a test suite nobody runs is documentation.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  sponsored-receipts:
    name: sponsored-receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: script/package-lock.json
      - run: npm ci
        working-directory: script
      - run: node --import tsx test-sponsored-receipt.ts
        working-directory: script

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - run: npm run typecheck
        working-directory: indexer

  relay-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: voidscan-test-only
          POSTGRES_DB: voidscan_check
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:voidscan-test-only@127.0.0.1:15439/voidscan_check
      PGPASSWORD: voidscan-test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: script
      - run: npm ci
        working-directory: web
      - run: psql -h 127.0.0.1 -p 15439 -U postgres -d voidscan_check -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: node --import tsx test-relay-concurrency.ts
        working-directory: script
      - run: node --import tsx test-astra-regressions.ts
        working-directory: script
      - run: node --import tsx test-durable-relay.ts
        working-directory: script

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            script/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: script
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: script
      - run: npm run build:contracts
        working-directory: script
