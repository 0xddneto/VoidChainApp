name: testnet-monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet-monitor
  cancel-in-progress: false

jobs:
  public-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: script/package-lock.json
      - run: npm ci
        working-directory: script
      - uses: actions/cache/restore@v5
        with:
          path: script/deployments/paymaster-monitor-state.json
          key: paymaster-monitor-${{ github.run_id }}
          restore-keys: paymaster-monitor-
      - run: npm run monitor:testnet-v10
        working-directory: script
      - uses: actions/cache/save@v5
        if: success()
        with:
          path: script/deployments/paymaster-monitor-state.json
          key: paymaster-monitor-${{ github.run_id }}
