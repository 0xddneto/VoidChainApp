title = "VOID secret scan - default rules with narrow public-data exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public EVM contract addresses in deployment manifests (not private keys)"
condition = "AND"
paths = ['''^(web/lib/(deployment|dex-chain1(-v10)?|genesis-v(6|10))\.json|voiddex/app/(dex-config\.(ts|json)|DexClient\.tsx|page\.tsx))$''']
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[rules.allowlists]]
description = "Historical empty keeper key followed by the interval variable name"
condition = "AND"
paths = ['''^script/\.env\.example$''']
regexTarget = "secret"
regexes = ['''^KEEPER_INTERVAL_MS=60000$''']

[[rules.allowlists]]
description = "Literal NFT display name in the rename unit test"
condition = "AND"
paths = ['''^test/Authority\.t\.sol$''']
regexTarget = "secret"
regexes = ['''^Nova-Atlantis_2\.0$''']
