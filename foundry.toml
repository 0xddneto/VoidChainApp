[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"

# Compiler version pinned, not floating.
#
# The auditor approves a specific bytecode; what gets deployed has to be exactly
# that one. With `^0.8.24`, everyone compiling on a different date would produce
# a binary different from the audited one.
#
# The selection criterion: mature, not newest. Freshly released compilers have
# introduced code-generation bugs before, and Solidity's official list of known
# bugs should be consulted before changing this number.
solc_version = "0.8.28"

# EVM version pinned — and this is critical for a parent-chain runtime.
#
# Modern compilers pick the target EVM on their own, and their default is
# calibrated for Ethereum. VOID's current runtime executes on Robinhood Chain,
# whose ArbOS adoption schedule can differ from Ethereum's.
# TSTORE, TLOAD and MCOPY (Cancun) only exist on Arbitrum from ArbOS 20 "Atlas".
#
# Leaving this at the default means accepting that the compiler may emit
# instructions some of the 1,111 chains cannot execute — an error that surfaces
# at deploy time, or worse, at run time.
#
# "shanghai" is the safe common denominator: earlier than Cancun, supported by
# any ArbOS we will meet. Moving to "cancun" is possible and would bring
# ReentrancyGuardTransient (considerably cheaper), but only after confirming on
# testnet which ArbOS our chains actually run.
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200

# MegaLoad constructs 100 isolated spaces and 2,000 sponsored users before it
# starts measuring calls. That setup is intentionally bigger than a production
# block, and Foundry executes it as one test transaction; keep its harness limit
# above the setup cost so the load test fails on an assertion, not on scaffolding.
gas_limit = 3_000_000_000

# Fail on Solidity compiler warnings. Foundry's broad style-linter is kept as a
# separate review signal for now: the existing, deliberately multi-contract test
# fixtures produce hundreds of non-security style findings, so making every test
# run fail on them would hide real test failures behind old noise.
deny = "warnings"

[lint]
lint_on_build = false

[fmt]
line_length = 100
tab_width = 4
